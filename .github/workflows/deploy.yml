name: Deploy Next.js to VPS

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Guardrails (env x branch)
        run: |
          echo "ref_name=${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Deploy production só pode rodar a partir da branch main."
            exit 1
          fi
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 23377
          script: |
            set -eu
            export NVM_DIR="/home/deploy/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ${{ secrets.APP_DIR }}

            if [ ! -d .git ]; then
              echo "Diretório não é um repositório git: $PWD"
              exit 1
            fi
            if [ -n "$(git status --porcelain | grep -v '^ M \\.env$' | grep -v '^\\?\\? \\.env$' || true)" ]; then
              echo "Working tree com alterações locais (fora .env). Abortando para evitar overwrite inesperado."
              exit 1
            fi
            if [ -n "$(git status --porcelain | grep '^ M \\.env$' || true)" ]; then
              git checkout -- .env
            fi

            PREV="$(git rev-parse HEAD)"
            BRANCH="${{ github.ref_name }}"
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/connect_deploy_key -o IdentitiesOnly=yes"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git pull --ff-only origin "$BRANCH"

            cat > .env <<'EOF'
            ${{ secrets.ENV_PROD }}
            EOF
            chmod 600 .env

            if [ ! -d node_modules ] || git diff --name-only "$PREV..HEAD" -- package-lock.json package.json | grep -q .; then
              npm ci
            fi

            rm -rf .next
            npm run build
            pm2 restart connect-ecommerce --update-env || pm2 start npm --name "connect-ecommerce" -- start -- -p 3000
            pm2 save
