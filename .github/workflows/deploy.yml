name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps (MICROSERVICES + REDIS)
        run: |
          set -eu
          shopt -s nullglob
          for dir in MICROSERVICES/* REDIS; do
            if [ -f "$dir/package.json" ]; then
              if [ -f "$dir/package-lock.json" ]; then
                npm ci --prefix "$dir"
              else
                npm install --prefix "$dir"
              fi
            fi
          done
          if [ -f "MICROSERVICES/image-scraper-mcp-server/package.json" ]; then
            npm run build --prefix "MICROSERVICES/image-scraper-mcp-server"
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Guardrails (env x branch)
        run: |
          echo "ref_name=${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Deploy production só pode rodar a partir da branch main."
            exit 1
          fi
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 23377
          script: |
            set -eu
            export NVM_DIR="/home/deploy/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ${{ secrets.APP_DIR }}

            if [ ! -d .git ]; then
              echo "Diretório não é um repositório git: $PWD"
              exit 1
            fi
            PREV="$(git rev-parse HEAD)"
            BRANCH="${{ github.ref_name }}"
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/connect_deploy_key -o IdentitiesOnly=yes"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            if [ ! -f .env ]; then
              echo "Arquivo .env não encontrado no servidor. Copie o .env via SSH (scp) antes de rodar o deploy."
              exit 1
            fi
            chmod 600 .env

            if [ -d "REDIS" ]; then
              if [ ! -f "REDIS/.env" ]; then
                echo "Arquivo REDIS/.env não encontrado no servidor. Copie o REDIS/.env via SSH (scp) antes de rodar o deploy."
                exit 1
              fi
              chmod 600 "REDIS/.env"
            fi

            install_if_needed() {
              dir="$1"
              if [ ! -f "$dir/package.json" ]; then
                return 0
              fi
              if [ -f "$dir/package-lock.json" ]; then
                changed="$(git diff --name-only "$PREV..HEAD" -- "$dir/package-lock.json" "$dir/package.json" 2>/dev/null || true)"
              else
                changed="$(git diff --name-only "$PREV..HEAD" -- "$dir/package.json" 2>/dev/null || true)"
              fi
              if [ ! -d "$dir/node_modules" ] || echo "$changed" | grep -q .; then
                if [ -f "$dir/package-lock.json" ]; then
                  npm ci --prefix "$dir"
                else
                  npm install --prefix "$dir"
                fi
              fi
            }

            install_if_needed "REDIS"
            if [ -d "MICROSERVICES" ]; then
              for dir in MICROSERVICES/*; do
                if [ -d "$dir" ]; then
                  install_if_needed "$dir"
                fi
              done
            fi

            MCP_DIR="MICROSERVICES/image-scraper-mcp-server"
            if [ -f "$MCP_DIR/package.json" ]; then
              if [ ! -d "$MCP_DIR/dist" ] || git diff --name-only "$PREV..HEAD" -- "$MCP_DIR/" | grep -q .; then
                npm run build --prefix "$MCP_DIR"
              fi
            fi

            if [ ! -d node_modules ] || git diff --name-only "$PREV..HEAD" -- package-lock.json package.json | grep -q .; then
              npm ci
            fi

            rm -rf .next
            npm run build
            pm2 restart connect-ecommerce --update-env || pm2 start npm --name "connect-ecommerce" -- start -- -p 3000
            pm2 save
